openapi: 3.2.0
info:
  title: ACA-Py Admin Forward API
  description: Aries Cloud Agent Python (ACA-Py), a project of the OpenWallet Foundation, exposes an OpenAPI-documented REST Admin API used by controller applications to manage agent behavior, connections, and verifiable credential exchanges over DIDComm.
  version: 1.0.0
  contact:
    name: ACA-Py Documentation
    url: https://aca-py.org/
servers:
- url: http://{host}:{port}
  description: ACA-Py admin endpoint (host and port set via --admin)
  variables:
    host:
      default: localhost
    port:
      default: '3001'
security:
- AdminApiKey: []
tags:
- name: Forward
paths:
  /forward:
    get:
      summary: List forward messages
      description: Returns forward message delivery records. Requires the agent to be run with --monitor-forward.
      operationId: listForwardMessages
      responses:
        '200':
          description: Forward message records
          content:
            application/json:
              schema:
                type: object
      tags:
      - Forward
components:
  securitySchemes:
    AdminApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Admin API key configured at agent startup via --admin-api-key.
